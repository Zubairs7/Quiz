    @keyframes fadeIn {

    }

      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes slideIn {
      from { transform: translateX(-100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes glow {
      0% { box-shadow: 0 0 5px rgba(0, 242, 254, 0.4); }

      100% { box-shadow: 0 0 5px rgba(0, 242, 254, 0.4); }
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      font-family: 'Poppins', sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
      animation: fadeIn 1s ease-out;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      color: #00f2fe;
      animation: slideIn 1s ease-out;
    }

    .question {
      background: linear-gradient(135deg, #051937 0%, #00f2fe 100%);
      padding: 20px;
      margin: 20px 0;
      border-radius: 20px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
      animation: fadeIn 0.5s ease-out;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .question:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 25px rgba(0, 242, 254, 0.6);
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .options label {
      background-color: #0f172a;
      padding: 10px;
      border: 2px solid #00f2fe;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      animation: fadeIn 0.5s ease-out;
    }

    .options label:hover {
      background-color: #00c6d2;
      color: #051937;
      transform: scale(1.02);
    }

    img {
      width: 200px;
      margin-top: 10px;
      border-radius: 10px;
      transition: transform 0.3s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    #submit-btn {
      margin-top: 30px;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      background-color: #00f2fe;
      color: #051937;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
      transition: all 0.3s ease;
      animation: pulse 2s infinite;
    }

    #submit-btn:hover {
      background-color: #00c6d2;
      transform: scale(1.05);
      animation: none;
    }

    #result {
      margin-top: 30px;
      font-size: 22px;
      font-weight: bold;
      color: #00f2fe;
      text-align: center;
      animation: fadeIn 1s ease-out;
    }

    .result-card {
      animation: fadeIn 1s ease-out, glow 3s infinite;
    }

    /* Loading animation */
    #pdf-loading {
      animation: pulse 1.5s infinite;
    }

    /* Chart animation */
    canvas {
      animation: fadeIn 1s ease-out;
    }

    /* Personality traits animation */
    .trait-bar {
      animation: slideIn 1s ease-out;
    }

  function buildQuiz() {
  try {
    const container = document.getElementById("quiz-container");
    if (!container) {
      console.error("Quiz container not found");
      return;
    }

    container.innerHTML = "";

    quizData.forEach((q, index) => {
      const div = document.createElement("div");
      div.className = "question";

      const h2 = document.createElement("h2");
      h2.innerHTML = `${index + 1}. ${q.question}`;
      div.appendChild(h2);

      if (q.image) {
        const img = document.createElement("img");
        img.src = q.image;
        img.alt = `Question ${index + 1} Image`;
        img.onerror = function() {
          console.warn(`Image failed to load for question ${index + 1}`);
          this.style.display = 'none';
        };
        div.appendChild(img);
      }

      const opts = document.createElement("div");
      opts.className = "options";

      q.options.forEach(opt => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = q.type;
        input.name = q.name;
        input.value = opt;
        label.appendChild(input);
        label.appendChild(document.createTextNode(" " + opt));
        opts.appendChild(label);
      });

      div.appendChild(opts);
      container.appendChild(div);
    });

    const submitWrapper = document.getElementById("submit-wrapper");
    if (submitWrapper) {
      submitWrapper.style.display = "block";
    }
  } catch (error) {
    console.error("Error building quiz:", error);
    alert("There was an error loading the quiz. Please refresh the page.");
  }
}

function handleSubmit() {
  try {
    const resultDiv = document.getElementById("result");
    if (!resultDiv) {
      console.error("Result container not found");
      return;
    }

    resultDiv.innerHTML = "";
    let answered = 0;
    let total = quizData.length;
    const answers = {};

    // Validate quiz data
    if (!Array.isArray(quizData) || quizData.length === 0) {
      throw new Error("Invalid quiz data");
    }

    quizData.forEach(q => {
      if (!q.name) {
        console.warn("Question missing name property");
        return;
      }

      const selected = Array.from(document.querySelectorAll(`input[name="${q.name}"]:checked`));
      if (selected.length > 0) {
        answered++;
        answers[q.name] = selected.map(i => i.value);
      } else {
        answers[q.name] = [];
      }
    });

    // Validate minimum answers
    if (answered === 0) {
      alert("Please answer at least one question before submitting.");
      return;
    }

    const summary = generateDetailedReport(answers);
    resultDiv.innerHTML = `
      <div style="background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1);" class="result-card">
        <h2 style="color: #00f2fe; text-align: center;">Your AI-Generated Personality Report</h2>
        <div id="reportText" style="color: black;">
          ${summary}
        </div>
        <div style="text-align: center; margin-top: 20px;">
          <button onclick="downloadPDF()" style="padding: 12px 25px; background-color: #00f2fe; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
            Download PDF Report
          </button>
        </div>
      </div>
    `;

    // Animate score bars
    animateScoreBars();

    // Scroll to results with smooth animation
  } catch (error) {
    console.error("Error handling submit:", error);
    alert("There was an error processing your submission. Please try again.");
  }
}

function downloadPDF() {
  try {
    const pdfContainer = document.createElement('div');
    pdfContainer.style.cssText = `
      padding: 40px;
      background-color: white;
      color: black;
      width: 210mm;
      margin: 0 auto;
      font-family: Arial, sans-serif;
    `;

    const resultDiv = document.getElementById('result');
    if (!resultDiv || resultDiv.innerHTML.trim() === '') {
      alert('Please complete the quiz first to generate a report.');
      return;
    }

    const reportClone = resultDiv.cloneNode(true);

    const styleForPDF = `
      <style>
        * {
          -webkit-print-color-adjust: exact !important;
          color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        #pdf-container {
          font-family: Arial, sans-serif;
          color: black !important;
          background-color: white !important;
        }
        h1, h2, h3 {
          color: #000000 !important;
          margin: 15px 0;
          page-break-after: avoid;
        }
        p, li {
          color: #000000 !important;
          margin: 8px 0;
        }
        .trait-bar {
          margin: 15px 0;
          page-break-inside: avoid;
        }
        .score-bar {
          background: #00f2fe !important;
          height: 100%;
        }
        .career-card, .insight-card, .development-card {
          background: #f5f5f5 !important;
          padding: 15px;
          margin: 10px 0;
          border-radius: 5px;
          page-break-inside: avoid;
        }
        .result-section {
          margin: 20px 0;
          page-break-inside: avoid;
        }
        button {
          display: none !important;
        }
      </style>
    `;

    pdfContainer.innerHTML = styleForPDF;
    pdfContainer.appendChild(reportClone);

    const loadingDiv = document.createElement('div');
    loadingDiv.id = 'pdf-loading';
    loadingDiv.innerHTML = 'Generating PDF...';
    loadingDiv.style.cssText = `
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      background: #00f2fe;
      color: white;
      border-radius: 10px;
      z-index: 9999;
      font-family: 'Poppins', sans-serif;
    `;
    document.body.appendChild(loadingDiv);

    document.body.appendChild(pdfContainer);

    const opt = {
      margin: [15, 15],
      filename: 'Monster_AI_Personality_Report.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        logging: false,
        backgroundColor: '#ffffff',
        letterRendering: true
      },
      jsPDF: {
        unit: 'mm',
        format: 'a4',
        orientation: 'portrait'
      },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };

    const pdfPromise = html2pdf().from(pdfContainer).set(opt).save();

    const timeout = setTimeout(() => {
      if (loadingDiv.parentNode) {
        document.body.removeChild(loadingDiv);
      }
      if (pdfContainer.parentNode) {
        document.body.removeChild(pdfContainer);
      }
      alert('PDF generation timed out. Please try again.');
    }, 30000);

    pdfPromise.then(() => {
      clearTimeout(timeout);
      if (loadingDiv.parentNode) {
        document.body.removeChild(loadingDiv);
      }
      if (pdfContainer.parentNode) {
        document.body.removeChild(pdfContainer);
      }
    }).catch(err => {
      clearTimeout(timeout);
      console.error('PDF generation failed:', err);
      alert('Failed to generate PDF. Please try again.');
      if (loadingDiv.parentNode) {
        document.body.removeChild(loadingDiv);
      }
      if (pdfContainer.parentNode) {
        document.body.removeChild(pdfContainer);
      }
    });
  } catch (error) {
    console.error("Error in PDF generation:", error);
    alert("There was an error generating the PDF. Please try again.");
    const loadingDiv = document.getElementById('pdf-loading');
    if (loadingDiv) {
      document.body.removeChild(loadingDiv);
    }
    const pdfContainer = document.getElementById('pdf-container');
    if (pdfContainer) {
      document.body.removeChild(pdfContainer);
    }
  }
}



function generateDetailedReport(answers) {
  // Calculate trait scores
  let traits = {
    'Analytical Thinking': 0,
    'Creativity': 0,
    'Leadership': 0,
    'Social Skills': 0,
    'Technical Aptitude': 0
  };
  
  // Calculate scores based on answers
  Object.entries(answers).forEach(([question, answer]) => {
    if (answer.includes('Yes')) {
      if (question.match(/q(10|40|41|51)/)) traits['Analytical Thinking'] += 20;
      if (question.match(/q(2|53|58|59)/)) traits['Creativity'] += 20;
      if (question.match(/q(4|5|49|60)/)) traits['Leadership'] += 20;
      if (question.match(/q(1|8|47|54)/)) traits['Social Skills'] += 20;
      if (question.match(/q(3|7|50)/)) traits['Technical Aptitude'] += 20;
    }
  });

  // Normalize scores
  Object.keys(traits).forEach(trait => {
    traits[trait] = Math.min(100, Math.round(traits[trait]));
  });

  // Generate career recommendations
  const careerSuggestions = [];
  if (traits['Analytical Thinking'] >= 60) careerSuggestions.push('Data Analyst', 'Business Analyst');
  if (traits['Creativity'] >= 60) careerSuggestions.push('UX Designer', 'Content Creator');
  if (traits['Leadership'] >= 60) careerSuggestions.push('Project Manager', 'Team Lead');
  if (traits['Social Skills'] >= 60) careerSuggestions.push('Customer Success Manager', 'HR Professional');
  if (traits['Technical Aptitude'] >= 60) careerSuggestions.push('Software Developer', 'Systems Engineer');

  // Calculate completion stats
  const totalQuestions = Object.keys(quizData).length;
  const answeredQuestions = Object.values(answers).filter(a => a.length > 0).length;
  const completionPercentage = Math.round((answeredQuestions / totalQuestions) * 100);

  return `
    <div style="font-family: Arial, sans-serif; color: black !important; background-color: white !important; padding: 20px;" class="result-card">
      <h1 style="color: black !important; text-align: center;" class="animate-slideIn">Your AI Personality Analysis Report</h1>
      <p style="text-align: center; font-style: italic; color: black !important;">Generated on ${new Date().toLocaleDateString()}</p>
      
      <div style="margin: 20px 0; text-align: center; color: black !important;">
        <strong>Completion Rate:</strong> ${completionPercentage}%<br>
        <strong>Questions Answered:</strong> ${answeredQuestions} out of ${totalQuestions}
      </div>

      <div style="margin: 30px 0;">
        <h2 style="color: black !important;">🧠 Personality Profile</h2>
        ${Object.entries(traits)
          .map(([trait, score], index) => `
            <div style="margin: 15px 0; color: black !important;" class="trait-bar" style="animation-delay: ${index * 0.2}s">
              <strong>${trait}:</strong> ${score}%
              <div style="background: #eee; height: 20px; width: 100%; margin-top: 5px;">
                <div style="background: #00f2fe; height: 100%; width: 0%; transition: width 1s ease-out;" class="score-bar" data-score="${score}"></div>
              </div>
            </div>
          `).join('')}
      </div>

      <div style="margin: 30px 0;">
        <h2 style="color: black !important;">🎯 Recommended Career Paths</h2>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
          ${careerSuggestions.map((career, index) => `
            <div style="background: #f5f5f5; padding: 15px; border-radius: 5px; color: black !important;" class="career-card" style="animation: fadeIn 0.5s ease-out ${index * 0.2}s forwards;">
              <strong>${career}</strong>
            </div>
          `).join('')}
        </div>
      </div>

      <div style="margin: 30px 0;">
        <h2 style="color: black !important;">💡 Key Insights</h2>
        <ul style="list-style-type: none; padding: 0;">
          ${Object.entries(traits)
            .filter(([_, score]) => score >= 70)
            .map(([trait, score], index) => `
              <li style="margin: 10px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; color: black !important;" class="insight-card" style="animation: slideIn 0.5s ease-out ${index * 0.2}s forwards;">
                You show strong capabilities in ${trait} (${score}%). This suggests you would excel in roles that require ${trait.toLowerCase()}.
              </li>
            `).join('')}
        </ul>
      </div>

      <div style="margin: 30px 0;">
        <h2 style="color: black !important;">📈 Areas for Development</h2>
        <ul style="list-style-type: none; padding: 0;">
          ${Object.entries(traits)
            .filter(([_, score]) => score < 50)
            .map(([trait], index) => `
              <li style="margin: 10px 0; padding: 15px; background: #f5f5f5; border-radius: 5px; color: black !important;" class="development-card" style="animation: slideIn 0.5s ease-out ${index * 0.2}s forwards;">
                Consider focusing on developing your ${trait.toLowerCase()} skills to broaden your career opportunities.
              </li>
            `).join('')}
        </ul>
      </div>

      <div style="margin-top: 30px; text-align: center; font-style: italic; font-size: 0.9em; color: #666 !important;">
        This report is generated based on your responses to the Monster AI Quiz.<br>
        It is meant to provide insights and suggestions, not definitive conclusions.
      </div>
    </div>
  `;
}

}
